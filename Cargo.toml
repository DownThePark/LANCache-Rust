[package]
name = "lancache"
version = "0.7.0"
edition = "2021"

[dependencies]
pingora = { version = "0.7.0", features = ["proxy"] }
async-trait = "0.1"
tokio = { version = "1", features = ["full"] }
bytes = "1.0"
log = "0.4"
env_logger = "0.11"
hickory-server = "0.24"
hickory-proto = "0.24"
hickory-resolver = "0.24"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
